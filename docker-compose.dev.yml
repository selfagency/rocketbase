services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./db/pb_hooks:/pb_hooks
      - ./db/pb_migrations:/pb_migrations
      - ./db/pb_data:/pb_data
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - e2e

networks:
  e2e:
    driver: bridge
